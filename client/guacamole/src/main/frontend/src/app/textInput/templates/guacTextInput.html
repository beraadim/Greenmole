<!-- Modified for Greenmole by its maintainers. -->
<div class="text-input" ng-class="{'native-keyboard': nativeKeyboard}">

    <div class="native-keyboard-controls" ng-if="nativeKeyboard">
        <button type="button" class="native-keyboard-show"
                ng-mousedown="$event.preventDefault()" ng-click="showNativeKeyboard($event)"
                aria-pressed="{{nativeKeyboardState.keyboardOpen}}"
                aria-label="{{'CLIENT.ACTION_SHOW_NATIVE_KEYBOARD' | translate}}"
                title="{{'CLIENT.ACTION_SHOW_NATIVE_KEYBOARD' | translate}}">
            <span aria-hidden="true">⌨</span>
            <span class="native-keyboard-label">{{'CLIENT.ACTION_SHOW_NATIVE_KEYBOARD' | translate}}</span>
        </button>
        <button type="button" class="native-keyboard-pan"
                ng-mousedown="$event.preventDefault()" ng-click="toggleDesktopPan($event)"
                aria-pressed="{{nativeKeyboardState.panning}}"
                aria-label="{{'CLIENT.ACTION_PAN_DESKTOP' | translate}}"
                title="{{'CLIENT.HELP_PAN_DESKTOP' | translate}}">
            <span aria-hidden="true">↕</span>
            <span class="native-keyboard-label">{{'CLIENT.ACTION_PAN_DESKTOP' | translate}}</span>
        </button>
        <button type="button" class="native-keyboard-scroll"
                ng-mousedown="$event.preventDefault()" ng-click="toggleRemoteScroll($event)"
                aria-pressed="{{nativeKeyboardState.scrolling}}"
                aria-label="{{'CLIENT.ACTION_SCROLL_WHEEL' | translate}}"
                title="{{'CLIENT.HELP_SCROLL_WHEEL' | translate}}">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                <rect x="5" y="2" width="14" height="20" rx="7" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M12 5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="native-keyboard-label">{{'CLIENT.ACTION_SCROLL_WHEEL' | translate}}</span>
        </button>
        <button type="button" class="native-keyboard-settings"
                ng-mousedown="$event.preventDefault()" ng-click="showConnectionSettings($event)"
                aria-controls="guac-menu"
                aria-label="{{'APP.ACTION_MANAGE_SETTINGS' | translate}}"
                title="{{'APP.ACTION_MANAGE_SETTINGS' | translate}}">
            <span aria-hidden="true">⚙</span>
            <span class="native-keyboard-label">{{'APP.ACTION_MANAGE_SETTINGS' | translate}}</span>
        </button>
    </div>

    <!-- A mounted, visible real editor allows iOS keyboard opening within the
         show button's trusted gesture without waiting for Angular rendering. -->
    <div class="text-input-field">
        <div class="sent-history" ng-if="!nativeKeyboard"><div class="sent-text" ng-repeat="text in sentText track by $index">{{text}}</div></div><textarea rows="1" class="target" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false" inputmode="text" aria-label="{{'CLIENT.FIELD_NATIVE_TEXT_INPUT' | translate}}"></textarea>
    </div>
    <div class="text-input-buttons">
        <guac-key keysym="65507" sticky="true" text="'CLIENT.NAME_KEY_CTRL'" pressed="ctrlPressed"></guac-key><guac-key keysym="65513" sticky="true" text="'CLIENT.NAME_KEY_ALT'" pressed="altPressed"></guac-key><guac-key keysym="65307" text="'CLIENT.NAME_KEY_ESC'"></guac-key><guac-key keysym="65289" text="'CLIENT.NAME_KEY_TAB'"></guac-key>
    </div>

</div>
