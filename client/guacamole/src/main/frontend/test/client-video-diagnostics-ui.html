<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Greenmole optional video diagnostics UI test</title>
    <style>body { margin: 0; background: #234; } #fixture { position: relative; width: 100vw; height: 100vh; }</style>
    <link rel="stylesheet" href="../src/app/client/styles/diagnostics.css">
    <script src="../node_modules/angular/angular.js"></script>
    <script>angular.module('client', []);</script>
    <script src="../src/app/client/directives/guacClientDiagnostics.js"></script>
</head>
<body>
    <div id="fixture"></div>
    <script>
    // Serve the repository root over HTTP, then open this file at a phone width.
    // The real directive, template and CSS use numeric synthetic samples only.
    (async function() {
        const checks = [];
        function check(name, condition) {
            checks.push({ name, passed: !!condition });
            if (!condition) throw new Error(name);
        }
        try {
            const translations = await (await fetch('../src/translations/en.json')).json();
            const template = await (await fetch('../src/app/client/templates/guacClientDiagnostics.html')).text();
            angular.module('client').filter('translate', function() {
                return key => key.split('.').reduce((value, part) => value && value[part], translations) || key;
            });
            const injector = angular.injector(['ng', 'client']);
            injector.get('$templateCache').put('app/client/templates/guacClientDiagnostics.html', template);
            const root = injector.get('$rootScope'), scope = root.$new();
            const calls = [];
            scope.managed = {
                clientProperties: { showStatistics: false },
                performance: {
                    start() { calls.push('start'); },
                    stop() { calls.push('stop'); },
                    sample() {
                        calls.push('sample');
                        return { width: 1920, height: 1080, connected: true, transport: 'websocket',
                            videoTiming: { assemblyAverageMs: 1000.1, assemblyMaxMs: 1000.2,
                                encodedQueueAverageMs: 1000.3, encodedQueueMaxMs: 1000.4,
                                decodeOutputAverageMs: 1000.5, decodeOutputMaxMs: 1000.6,
                                orderedDisplayAverageMs: 1000.7, orderedDisplayMaxMs: 1000.8 } };
                    }
                }
            };
            const element = injector.get('$compile')('<guac-client-diagnostics client="managed"></guac-client-diagnostics>')(scope);
            document.getElementById('fixture').appendChild(element[0]);
            root.$digest();
            check('Hidden overlay does not collect or render', calls.length === 0 && !element[0].querySelector('.client-diagnostics'));
            scope.managed.clientProperties.showStatistics = true;
            root.$digest();
            const panel = element[0].querySelector('.client-diagnostics');
            check('Explicit enable starts the existing monitor', calls.join(',') === 'start,sample');
            check('Translated diagnostic heading is rendered', panel.textContent.includes('AVC420 stages: average / maximum (ms)'));
            check('All stage values use the real template bindings', ['Assembly: 1000.1 / 1000.2',
                'Encoded queue: 1000.3 / 1000.4', 'Decode/output: 1000.5 / 1000.6',
                'Ordered display: 1000.7 / 1000.8'].every(text => panel.textContent.includes(text)));
            check('Timing limitations are translated', Array.from(panel.querySelectorAll('[title]'))
                .some(node => node.title.includes('callback scheduling')));
            const box = panel.getBoundingClientRect();
            check('Overlay remains within the phone viewport', box.left >= 0 && box.right <= innerWidth);
            check('No horizontal document overflow', document.documentElement.scrollWidth <= innerWidth);
            const result = { status: 'passed', width: innerWidth, checks,
                overlay: { left: box.left, right: box.right, width: box.width, height: box.height },
                collectionEnabledOnlyForOverlay: true, syntheticStatisticsOnly: true,
                authenticated: false, rdpConnected: false };
            // Preserve the rendered panel for screenshot review; destroy the
            // real directive immediately so its existing interval is cancelled.
            const screenshot = panel.cloneNode(true);
            scope.$destroy();
            check('Destroy stops collection', calls.join(',') === 'start,sample,stop');
            element.remove();
            document.getElementById('fixture').appendChild(screenshot);
            window.videoDiagnosticsUITestResult = result;
        }
        catch (error) {
            window.videoDiagnosticsUITestResult = { status: 'failed', checks, error: error.message };
            document.body.setAttribute('data-failed', error.message);
        }
    })();
    </script>
</body>
</html>
